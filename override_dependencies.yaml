# =============================================================================
# SHARED DEPENDENCY VERSIONS
# =============================================================================
# This file centralizes all dependency versions for the workspace.
# All packages should use these versions to ensure consistency.
#
# Usage:
# 1. Define versions here (reference only)
# 2. Root pubspec.yaml defines actual versions
# 3. Child packages use `resolution: workspace` + `any` to inherit
#
# =============================================================================

# =============================================================================
# FLUTTER SDK
# =============================================================================
flutter_sdk: ">=3.38.8 <4.0.0"
dart_sdk: ">=3.9.0 <4.0.0"

# =============================================================================
# STATE MANAGEMENT
# =============================================================================
flutter_bloc: ^10.0.6
bloc_event_transformers: ^2.0.0

# =============================================================================
# DEPENDENCY INJECTION
# =============================================================================
get_it: ^9.2.0
injectable: ^2.7.1+4

# =============================================================================
# CODE GENERATION - ANNOTATIONS
# =============================================================================
freezed_annotation: ^3.1.0
json_annotation: ^4.10.0
auto_route: ^11.1.0
retrofit: ^4.9.2

# =============================================================================
# CODE GENERATION - GENERATORS (dev_dependencies)
# =============================================================================
build_runner: ^2.11.0
freezed: ^3.2.5
json_serializable: ^6.12.0
injectable_generator: ^2.12.0
auto_route_generator: ^10.4.0
retrofit_generator: ^10.2.1
flutter_gen_runner: ^5.12.0

# =============================================================================
# NETWORKING
# =============================================================================
dio: ^5.9.1
pretty_dio_logger: ^1.4.0

# =============================================================================
# LOCAL STORAGE
# =============================================================================
shared_preferences: ^2.5.4

# =============================================================================
# TOAST MESSAGE
# =============================================================================
fluttertoast: ^8.2.5

# =============================================================================
# UTILITIES
# =============================================================================
connectivity_plus: ^7.0.0
permission_handler: ^12.0.1
flutter_svg: ^2.0.10+1

# =============================================================================
# TESTING
# =============================================================================
flutter_lints: ^6.1.0
melos: ^7.4.0

# =============================================================================
# Internal Packages
# =============================================================================
app_utility: ^0.0.1
app_widget: ^0.0.1
domain: ^0.0.1
feature_auth: ^0.0.1
app_core: ^0.0.1

# =============================================================================
# synchronized
# =============================================================================
synchronized: ^3.4.0

# =============================================================================
# qr scanner 
# =============================================================================
mobile_scanner: ^7.1.4

# =============================================================================
# Local Database
# =============================================================================
sqflite: ^2.4.2
path: ^1.9.1
path_provider: ^2.1.5

# =============================================================================
# WORKSPACE PACKAGES
# =============================================================================
# These packages use `resolution: workspace` and inherit versions from root.
#
# packages/domain:
#   - freezed_annotation: any (inherits ^3.1.0)
#   - json_annotation: any (inherits ^4.10.0)
#   - get_it: any (inherits ^9.2.0)
#   - injectable: any (inherits ^2.7.1+2)
#   - shared_preferences: any (inherits ^2.5.4)
#
# packages/app_utility:
#   - flutter_lints: any (inherits ^6.1.0)
#
# packages/app_widget:
#   - flutter_lints: any (inherits ^6.1.0)
name: feature_dashboard
description: Dashboard feature package for Carbon v2
publish_to: 'none'
version: 0.0.1

# Inherit dependency versions from root pubspec.yaml
resolution: workspace

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.38.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Domain layer
  domain: any
  use_cases: any
  
  # State Management
  flutter_bloc: any

  # Dependency Injection
  get_it: any
  injectable: any
  
  # Code Generation
  freezed_annotation: any
  json_annotation: any
  
  # Routing
  auto_route: any

  intl: any
  table_calendar: any

  app_widget: any
  app_utility: any
  app_core: any
  feature_auth: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  
  # Code Generation
  build_runner: any
  freezed: any
  json_serializable: any
  injectable_generator: any
  auto_route_generator: any

flutter:
  generate: true

name: feature_auth
description: Authentication feature package (login, register, logout)
publish_to: 'none'
version: 0.0.1

# Inherit dependency versions from root pubspec.yaml
resolution: workspace

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.38.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Domain layer
  domain: any
  use_cases: any
  
  # State Management
  flutter_bloc: any
  
  # Assets
  flutter_svg: any
  
  # Dependency Injection
  get_it: any
  injectable: any
  
  # Code Generation
  freezed_annotation: any
  json_annotation: any
  
  # Routing
  auto_route: any

  app_widget: any
  app_utility: any
  app_core: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  
  # Code Generation
  build_runner: any
  freezed: any
  json_serializable: any
  injectable_generator: any
  auto_route_generator: any
  flutter_gen_runner: any

flutter:
  generate: true
  assets:
    - assets/image/splash.svg

flutter_gen:
  line_length: 250
  output: lib/assets/

  assets:
    outputs:
      package_parameter_enabled: false
      class_name: AuthAsset
  integrations:
    flutter_svg: true
